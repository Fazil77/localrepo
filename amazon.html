<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="astyle.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo">
                </div>
            </div>
            <div class="address border">
                <p class="first">Deliver To</p>
                <div class="add-icon" > 
                   <i class="fa-solid fa-location-dot"></i>
                    <p class="second">India</p>
                </div>    
            </div>
                    <div class="nav-search border">
                        <select title="All" class="search-select">
                            <option>All</option>
                        </select>
                        <input class="search-input border" type="text" placeholder="Search">
                        <div class="search-icon border">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>
                    <div class="nav-signin border">
                        <p><span>Hello, Sign In</span></p>
                        <p class="second">Account & Lists</p>
                    </div>
                     <div class="orders border">
                        <p><span>Returns</span></p>
                        <p class="second ">Orders</p>
                    </div>
                    <div class="cart border">
                        <i class="fa-solid fa-cart-arrow-down"></i>cart</div>
        </div>
        <div class="panel">
            <div>
        <i class="fa-solid fa-bars"></i>
        All</div>
        <div class="options">
            <p class="border">Today's Deals</p>
            <p class="border">Prime Video</p>
            <p class="border">Registry</p>
            <p class="border">Gift Cards</p>
            <p class="border">Customer Service</p>
            <p class="border">Sell</p>
        </div>
        <div class="deals border">
            Shop deals in Electronics
        </div>
    </div>
    </header>
    <div class="hero-section"></div>
</body>
</html>
